[project]
name = "orion"
version = "0.2.0"
description = "ORION — a personal English voice assistant with local or cloud models and a cyberpunk HUD"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    # brain
    "numpy>=2.5.4",
    # memory search and tool routing: static embeddings in-process (no Ollama needed unless he thinks locally)
    "model2vec>=0.10.0",
    # voice
    "sounddevice>=0.5",
    # 1.2.x: the voice detector runs the Silero VAD model this version ships (faster_whisper/assets/silero_vad_v6.onnx)
    "faster-whisper>=1.2.1,<1.3",
    # CTranslate2 4 runs Whisper on the GPU with cuBLAS alone (no cuDNN: 1.2 GB saved); 5 may need it again
    "ctranslate2>=4.8.3,<5",
    "huggingface-hub>=2.3.0",
    "filelock>=4.2.4",  # the memory lock, shared with the tools process (also what huggingface-hub uses)
    "tzlocal>=5.4.5",  # this PC's time zone (also what dateparser uses)
    # CUDA's cuBLAS so speech recognition can run on an NVIDIA GPU (installed on any x86-64 Linux; unused without one)
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "kokoro-onnx>=0.6",
    "onnxruntime>=1.31.0",
    # server / HUD
    "fastapi>=0.162.0",
    "python-multipart>=0.0.20",  # Customize's uploads (a plugin's .zip, a skill's): FastAPI reads multipart with it
    "uvicorn>=0.54",
    "websockets>=17.3",
    "httptools>=0.9.0",
    "watchfiles>=1.3",
    "pydantic>=2.14.1",
    "click>=8.5",
    # tools
    "psutil>=6.0,<8",
    "nvidia-ml-py>=13.0",
    "httpx>=0.27",
    "ddgs>=9.16.1",
    "trafilatura>=2.3.1",
    "dateparser>=1.2",
    # media playback and the screen lock over D-Bus (pure Python, MIT)
    "jeepney>=0.9",
    "pyyaml>=6.0",
    "mcp>=2.3.0,<3",
    # a benchmark's dry run checks a brain's arguments against each tool's schema, as the tool would (mcp uses it too)
    "jsonschema>=4.25,<5",
    "ruamel-yaml>=0.18",
    # your Claude plan as his brain, through the Claude Code you signed in to (built from source: it uses
    # that `claude` rather than bundling a second 100 MB copy)
    "claude-agent-sdk>=0.2.174,<0.3",
    # images the models look at (the screen, a camera, a browser, an attachment): sized down and compressed first
    "pillow>=13.0",
    # this machine's screen on X11, macOS and Windows (Wayland goes through the desktop's portal), and its clipboard
    "mss>=10.2,<11",
    "pyperclip>=1.11",
    "cronsim>=2.7",
    "caldav>=3.6.0,<4",
    "icalendar>=7",
    "recurring-ical-events>=3.8",
    "x-wr-timezone>=2",
    "discord-py>=2.7,<3",
    # the vault: secrets in the system's keyring (the desktop's Secret Service), never in config.yaml
    "keyring>=25.7,<26",
    # the redactor: every known secret, its encodings and the token patterns as one RE2 automaton (linear time;
    # Python's re tries each of hundreds of alternatives at every position)
    "google-re2>=1.1.20251105,<2",
    # instant commands: whole sentences matched against Home Assistant's English intent templates, without the model
    "hassil>=3.12,<4",
    "home-assistant-intents>=2026.10.6",
    # WebRTC's echo canceller (LiveKit's audio processing module), so he can be interrupted on the PC's own speakers
    "livekit>=1.1.21,<2",
    # your documents: PDF, Word, PowerPoint and Excel as Markdown (MIT), converted in a worker process
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.9,<0.2",
]

[project.urls]
Homepage = "https://github.com/ToniLabInc/Orion"
Issues = "https://github.com/ToniLabInc/Orion/issues"
Changelog = "https://github.com/ToniLabInc/Orion/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# An instant neural wake word, if you train one for "Orion" (see the README). Without it he wakes on his name,
# spotted by speech recognition.
wake = ["openwakeword>=0.6"]

[project.scripts]
orion = "orion.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]
# Node.js for building the HUD (web/), from PyPI, so a developer needs only uv: uv run --only-group web npm --prefix web ...
web = ["nodejs-wheel==24.19.0"]

[tool.uv]
# openwakeword pins tflite-runtime on Linux, which has no wheels for modern Python.
# We run its models through onnxruntime instead, so drop it: a marker uv can prove never holds (requires-python
# rules out Python 2) removes it outright, where an unknown platform such as 'never' would still need a wheel.
# cuBLAS pulls in NVRTC, which nothing loads (cuBLASLt never finds it, and Whisper works without it): skip 217 MB.
override-dependencies = ["tflite-runtime; python_version < '3'", "nvidia-cuda-nvrtc-cu12; sys_platform == 'never'"]
no-binary-package = ["claude-agent-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# The code is written for Python 3.12 (PEP 695 type statements) and wrapped at 120 columns.
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]  # discord.py's voice support, which Orion doesn't use
